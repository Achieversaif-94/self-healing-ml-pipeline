services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: ml-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped