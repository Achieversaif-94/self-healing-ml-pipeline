version: '3.8'

services:
  # ============================================
  # Backend: FastAPI + ML Model
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml-backend
    ports:
      - "8000:8000"
    volumes:
      - ./mlruns:/app/mlruns
      - ./current_data.csv:/app/current_data.csv
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  # ============================================
  # Frontend: React Dashboard
  # ============================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: ml-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped